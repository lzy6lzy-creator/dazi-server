services:
  db:
    image: pgvector/pgvector:pg16
    container_name: dazi-db
    restart: always
    environment:
      POSTGRES_USER: dazi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: dazi
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dazi"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: dazi-redis
    restart: always
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: dazi-api
    restart: always
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://dazi:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/dazi
      REDIS_URL: redis://redis:6379/0
      LLM_API_KEY: ${LLM_API_KEY:?LLM_API_KEY is required}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.moonshot.cn/v1}
      LLM_MODEL: ${LLM_MODEL:-kimi-k2.5}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      ADMIN_TOKEN: ${ADMIN_TOKEN:?ADMIN_TOKEN is required}
      INTERNAL_TEST_MODE: ${INTERNAL_TEST_MODE:-false}
      INTERNAL_TEST_CODE: ${INTERNAL_TEST_CODE:-}
      INTERNAL_TEST_PHONES: ${INTERNAL_TEST_PHONES:-}
      INTERNAL_TEST_PHONES_FILE: /code/runtime-config/internal_test_phones.txt
    volumes:
      - .:/code/runtime-config:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1

  web:
    image: nginx:alpine
    container_name: dazi-web
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./site:/usr/share/nginx/dazi-site:ro
      - ./travel-dist:/usr/share/nginx/travel:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
    depends_on:
      api:
        condition: service_started

volumes:
  pgdata:
